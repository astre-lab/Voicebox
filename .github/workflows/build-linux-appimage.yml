name: Build Linux AppImage

on:
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Voicebox Linux AppImage
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            llvm-dev \
            libasound2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Just
        run: cargo install just

      - name: Install dependencies
        run: just setup

      - name: Build Voicebox server
        run: |
          chmod +x scripts/build-server.sh
          ./scripts/build-server.sh

      - name: Build AppImage only
        working-directory: tauri
        run: bun run tauri build --bundles appimage

      - name: Show generated bundles
        run: |
          echo "=== Generated bundles ==="
          find tauri/src-tauri/target/release/bundle \
            -type f \
            -print

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: voicebox-linux-appimage
          path: tauri/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7
