
name: Build Voicebox GUI Docker Image

on:
  workflow_dispatch:

jobs:
  build:
    name: Build GUI Docker image
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Voicebox
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # Voicebox normally expects its local backend on 17493.
      # This build intentionally changes that default to 8000.
      - name: Configure backend port 8000
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/stores/serverStore.ts")
          text = path.read_text()

          old = "const fallback = 'http://127.0.0.1:17493';"
          new = "const fallback = 'http://127.0.0.1:8000';"

          if old not in text:
              raise SystemExit(
                  "Could not find the expected default backend URL. "
                  "The Voicebox source may have changed."
              )

          text = text.replace(old, new)

          old_port = "parsed.port === '17493'"
          new_port = "parsed.port === '8000'"

          if old_port not in text:
              raise SystemExit(
                  "Could not find the expected loopback port check."
              )

          text = text.replace(old_port, new_port)

          path.write_text(text)
          PY

          echo "=== Modified serverStore.ts ==="
          grep -n "8000\|17493" app/src/stores/serverStore.ts

      - name: Build web GUI
        working-directory: app
        run: bun run build

      - name: Create Dockerfile
        run: |
          cat > Dockerfile.gui <<'EOF'
          FROM nginx:alpine

          COPY app/dist/ /usr/share/nginx/html/

          RUN cat > /etc/nginx/conf.d/default.conf <<'NGINX'
          server {
              listen 8080;
              server_name _;

              root /usr/share/nginx/html;
              index index.html;

              location / {
                  try_files $uri $uri/ /index.html;
              }
          }
          NGINX

          EXPOSE 8080
          EOF

      - name: Build Docker image
        run: |
          docker build \
            --tag voicebox-gui:port8000 \
            --file Dockerfile.gui \
            .

      - name: Test Docker image
        run: |
          docker run \
            --detach \
            --name voicebox-gui-test \
            --publish 8080:8080 \
            voicebox-gui:port8000

          sleep 3

          curl --fail http://127.0.0.1:8080/

          docker stop voicebox-gui-test
          docker rm voicebox-gui-test

      - name: Export single Docker image
        run: |
          docker save voicebox-gui:port8000 \
            | gzip -1 \
            > voicebox-gui-port8000.tar.gz

          sha256sum voicebox-gui-port8000.tar.gz \
            > voicebox-gui-port8000.tar.gz.sha256

          ls -lh \
            voicebox-gui-port8000.tar.gz \
            voicebox-gui-port8000.tar.gz.sha256

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: voicebox-gui-port8000
          path: |
            voicebox-gui-port8000.tar.gz
            voicebox-gui-port8000.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

