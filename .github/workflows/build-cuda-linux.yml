name: Build CUDA Linux Backend

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-cuda-linux:
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -r backend/requirements.txt
          python -m pip install --no-deps chatterbox-tts
          python -m pip install --no-deps hume-tada

      - name: Install CUDA PyTorch
        run: |
          python -m pip install torch==2.10.0 torchaudio==2.10.0 \
            --index-url https://download.pytorch.org/whl/cu128

      - name: Verify PyTorch CUDA build
        run: |
          python - <<'PY'
          import torch
          import torchaudio

          print("PyTorch:", torch.__version__)
          print("TorchAudio:", torchaudio.__version__)
          print("CUDA build:", torch.version.cuda)

          assert torch.version.cuda is not None
          assert torch.version.cuda.startswith("12.8")
          PY

      - name: Build CUDA backend
        working-directory: backend
        env:
          TORCH_CUDA_ARCH_LIST: "8.0;8.6;8.9;9.0;12.0+PTX"
        run: |
          python build_binary.py --cuda

      - name: Verify Linux binary
        run: |
          test -f backend/dist/voicebox-server-cuda/voicebox-server-cuda
          test ! -f backend/dist/voicebox-server-cuda/voicebox-server-cuda.exe

          file backend/dist/voicebox-server-cuda/voicebox-server-cuda

      - name: Package CUDA backend
        run: |
          mkdir -p release-assets

          python scripts/package_cuda.py \
            backend/dist/voicebox-server-cuda/ \
            --output release-assets/ \
            --cuda-libs-version cu128-linux-v1 \
            --torch-compat ">=2.7.0,<2.11.0"

      - name: Rename Linux server archive
        run: |
          mv \
            release-assets/voicebox-server-cuda.tar.gz \
            release-assets/voicebox-server-cuda-linux.tar.gz

          mv \
            release-assets/voicebox-server-cuda.tar.gz.sha256 \
            release-assets/voicebox-server-cuda-linux.tar.gz.sha256

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voicebox-cuda-linux
          path: release-assets/

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
