
name: Build Voicebox Web GUI Docker Image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure backend URL
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/stores/serverStore.ts")
          text = path.read_text()

          old = """export function getDefaultServerUrl(): string {
            const fallback = 'http://127.0.0.1:17493';

            if (!import.meta.env.PROD || typeof window === 'undefined') {
              return fallback;
            }

            const { protocol, origin, hostname } = window.location;
            if (
              (protocol === 'http:' || protocol === 'https:') &&
              origin &&
              hostname !== 'tauri.localhost'
            ) {
              return origin;
            }

            return fallback;
          }"""

          if old not in text:
              print("Current getDefaultServerUrl():")
              start = text.index("export function getDefaultServerUrl")
              end = text.index(
                  "export function isLoopbackVoiceboxServerUrl",
                  start,
              )
              print(text[start:end])
              raise SystemExit(
                  "Expected source block was not found. "
                  "No files were modified."
              )

          new = """export function getDefaultServerUrl(): string {
            return 'http://127.0.0.1:8000';
          }

          """

          path.write_text(text.replace(old, new))
          PY

      - name: Verify backend URL
        run: |
          grep -n -A5 -B2 'getDefaultServerUrl' \
            app/src/stores/serverStore.ts

      - name: Build web frontend
        run: |
          cd web
          bunx --bun vite build

      - name: Create Dockerfile
        run: |
          cat > Dockerfile.gui <<'EOF'
          FROM nginx:alpine

          COPY web/dist/ /usr/share/nginx/html/

          EXPOSE 80

          CMD ["nginx", "-g", "daemon off;"]
          EOF

      - name: Build Docker image
        run: |
          docker build \
            -f Dockerfile.gui \
            -t voicebox-gui:port8000 \
            .

      - name: Test Docker image
        run: |
          docker run -d \
            --name voicebox-gui-test \
            -p 8080:80 \
            voicebox-gui:port8000

          trap 'docker rm -f voicebox-gui-test >/dev/null 2>&1 || true' EXIT

          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/ >/dev/null; then
              echo "Voicebox GUI is responding."
              exit 0
            fi
            sleep 1
          done

          echo "Voicebox GUI did not respond."
          docker logs voicebox-gui-test
          exit 1

      - name: Export Docker image
        run: |
          docker save voicebox-gui:port8000 | gzip -1 \
            > voicebox-gui-port8000.tar.gz

      - name: Upload single image file
        uses: actions/upload-artifact@v4
        with:
          name: voicebox-gui-port8000
          path: voicebox-gui-port8000.tar.gz
          if-no-files-found: error
